<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Video Scripts</title><style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f4f5f7;color:#111}
header{position:sticky;top:0;background:#111;color:#fff;padding:12px 14px;z-index:2}
h1{font-size:18px;margin:0}#meta{font-size:13px;opacity:.85;margin-top:2px}
.ctl{display:flex;gap:6px;margin-top:8px}input[type=search],select{flex:1;padding:9px;border-radius:8px;border:0;font-size:15px}
main{padding:10px}.card{background:#fff;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 3px #0002;overflow:hidden}
.row{display:flex;gap:10px;padding:10px;align-items:center;cursor:pointer}.row img{width:72px;height:54px;object-fit:cover;border-radius:6px;background:#ddd}
.t{font-weight:600;font-size:15px}.s{font-size:13px;color:#555}.b{font-size:11px;padding:2px 7px;border-radius:9px;color:#fff;margin-left:4px}
.Hot{background:#16a34a}.Warm{background:#ea580c}.Cool{background:#64748b}
.det{display:none;padding:0 12px 12px}.open .det{display:block}.script{font-size:17px;line-height:1.45;margin:8px 0}
.shot{font-size:13px;background:#eef2ff;padding:7px;border-radius:6px}.acts{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
button,.acts a{padding:8px 12px;border-radius:8px;border:0;background:#111;color:#fff;font-size:14px;text-decoration:none}
.part{background:#fef3c7}.done{background:#dcfce7}.rdy{background:#16a34a;color:#fff;font-size:11px;padding:2px 7px;border-radius:9px;margin-left:4px}
label{font-size:15px;display:flex;align-items:center;gap:8px;padding:6px 0}label input{width:26px;height:26px}.checks{margin-top:8px}
.st{font-size:11px;padding:2px 6px;border-radius:6px;margin-right:4px;background:#e5e7eb;color:#555}.st.on{background:#bbf7d0;color:#166534}.sts{margin-top:4px}
.nds{background:#dc2626;color:#fff;font-size:11px;padding:2px 7px;border-radius:9px;margin-left:4px}.vc{font-size:11px;margin-left:6px;color:#1d4ed8;font-weight:600}button.post{background:#16a34a;font-size:16px;padding:12px 18px;width:100%;margin-top:6px}
</style></head><body>
<header><h1>Daily Video Scripts</h1><div id="meta">Loading…</div>
<div class="ctl"><input type="search" id="q" placeholder="Search make, model, stock…"><select id="f"><option value="">All</option><option>Hot</option><option>Warm</option><option>Cool</option><option value="noscript">Script not filmed</option><option value="nobroll">B-roll not filmed</option><option value="ready">Ready to edit</option></select></div></header>
<main id="list"></main>
<script src="gen.js"></script><script>
const today=new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
const TOPIC='https://ntfy.sh/lux-ds-5ee480669bb99dd3';
let items=[],src='',open={},repo={checks:{},posted:{}},live=[],pending=JSON.parse(localStorage.getItem('pending2')||'[]'),syncOk=null,S={checks:{},posted:{}};
const cached=JSON.parse(localStorage.getItem('repoCache')||'null');if(cached)repo=cached;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
// Same merge as sync_counts.py: repo state + events; latest t wins per stock/kind; Posted deduped by id and clears both checks.
function compute(){const c=JSON.parse(JSON.stringify(repo.checks||{})),p=JSON.parse(JSON.stringify(repo.posted||{}));
 const seen=new Set();Object.values(p).forEach(a=>a.forEach(e=>seen.add(e.id)));
 const set=(s,k,v,t)=>{c[s]=c[s]||{};if(!c[s][k]||c[s][k].t<t)c[s][k]={v,t}};
 const evs=[...live,...pending],ids=new Set(repo.void||[]);
 evs.filter(e=>e&&e.id&&!ids.has(e.id)&&ids.add(e.id)).sort((a,b)=>a.t-b.t).forEach(e=>{const s=String(e.s);
  if(e.k==='s'||e.k==='b')set(s,e.k,e.v?1:0,e.t);
  else if(e.k==='p'){if(!seen.has(e.id)){seen.add(e.id);(p[s]=p[s]||[]).push({id:e.id,t:e.t,date:e.date})}set(s,'s',0,e.t);set(s,'b',0,e.t)}});
 S={checks:c,posted:p}}
const on=(s,k)=>!!(S.checks[s]&&S.checks[s][k]&&S.checks[s][k].v);
const vc=s=>(S.posted[s]||[]).length,lastP=s=>Math.max(0,...(S.posted[s]||[]).map(e=>e.t));
function savePend(){localStorage.setItem('pending2',JSON.stringify(pending))}
async function flush(){while(pending.length){try{const r=await fetch(TOPIC,{method:'POST',body:JSON.stringify(pending[0])});if(!r.ok)throw 0;live.push(pending.shift());savePend()}catch(e){syncOk=false;return}}}
function send(e){e.id=uid();e.t=Date.now();pending.push(e);savePend();compute();render();flush()}
async function pull(){try{
 try{const r=await (await fetch('state.json?'+Date.now(),{cache:'no-store'})).json();repo=r;localStorage.setItem('repoCache',JSON.stringify(r))}catch(e){}
 const t=await (await fetch(TOPIC+'/json?poll=1&since=all',{cache:'no-store'})).text();
 live=t.split('\n').filter(Boolean).map(l=>{try{const m=JSON.parse(l);return m.event==='message'?JSON.parse(m.message):null}catch(e){return null}}).filter(e=>e&&e.id);
 syncOk=true;await flush()}catch(e){syncOk=false}compute();if(items.length)render()}
async function load(){let d;try{d=await (await fetch('https://luxrepair2025-rgb.github.io/lux-tesla-battery/data.json',{cache:'no-store'})).json();src='live'}
 catch(e){d=await (await fetch('data.json')).json();src='bundled copy'}items=genScripts(d,today);try{const sj=(await (await fetch('scripts.json?'+Date.now(),{cache:'no-store'})).json()).scripts||{},pi=((scriptPeriod(today)%3)+3)%3;items.forEach(x=>{const v=sj[x.stock];if(v&&v[pi]){x.script=v[pi].script;x.shot=v[pi].shot;x.words=x.script.split(/\s+/).length;x.needs=false}else x.needs=true})}catch(e){items.forEach(x=>x.needs=true)}compute();render();await pull()}
function render(){const q=document.getElementById('q').value.toLowerCase(),f=document.getElementById('f').value,N=items.length;
 const ns=items.filter(x=>on(x.stock,'s')).length,nb=items.filter(x=>on(x.stock,'b')).length,nr=items.filter(x=>on(x.stock,'s')&&on(x.stock,'b')).length;
 document.getElementById('meta').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',timeZone:'America/New_York'})+` · Script ${ns}/${N} · B-roll ${nb}/${N} · Ready ${nr} · ${src} · ${syncOk===null?'syncing…':syncOk?'synced':'offline (saved on phone)'}`;
 const rk={Hot:0,Warm:1,Cool:2};const half=x=>on(x.stock,'s')!==on(x.stock,'b')?0:1;items.sort((a,b)=>half(a)-half(b)||vc(a.stock)-vc(b.stock)||lastP(a.stock)-lastP(b.stock)||rk[a.demand]-rk[b.demand]||b.price-a.price);
 const L=document.getElementById('list');L.innerHTML='';
 items.filter(x=>{const s=on(x.stock,'s'),b=on(x.stock,'b');return(!q||(x.title+' '+x.stock).toLowerCase().includes(q))&&(!f||(f==='noscript'?!s:f==='nobroll'?!b:f==='ready'?(s&&b):x.demand===f))}).forEach(x=>{
 const s=on(x.stock,'s'),b=on(x.stock,'b'),both=s&&b,n=vc(x.stock),c=document.createElement('div');c.className='card'+(both?' done':(s||b)?' part':'');c.dataset.stock=x.stock;
 c.innerHTML=`<div class="row"><img loading="lazy" src="${x.img||''}" alt=""><div><div class="t">${x.title}</div><div class="s">#${x.stock} · ${x.priceStr} · ${Math.round(x.miles).toLocaleString()} mi<span class="vc">${n} video${n===1?'':'s'}</span><span class="b ${x.demand}">${x.demand}</span>${both?'<span class="rdy">Ready to edit</span>':''}${s&&!b?'<span class="nds" style="background:#d97706">Needs B-roll</span>':''}${b&&!s?'<span class="nds" style="background:#d97706">Needs script</span>':''}${x.needs?'<span class="nds">needs script</span>':''}</div><div class="sts"><span class="st ${s?'on':''}">${s?'✓':'○'} Script</span><span class="st ${b?'on':''}">${b?'✓':'○'} B-roll</span></div></div></div>
<div class="det"><div class="shot">🎬 ${x.shot}</div><p class="script">${x.script}</p><div class="s">${x.words} words · ~${Math.round(x.words/2.6)}s</div>
<div class="acts"><button class="cp">Copy</button><a href="${x.url}" target="_blank">Listing</a></div><div class="checks"><label><input type="checkbox" class="cs" ${s?'checked':''}> Script filmed</label><label><input type="checkbox" class="cb" ${b?'checked':''}> B-roll filmed</label>${both?'<button class="post">✅ Posted</button>':''}</div></div>`;
 c.querySelector('.row').onclick=()=>{c.classList.toggle('open');c.classList.contains('open')?open[x.stock]=1:delete open[x.stock]};
 if(open[x.stock])c.classList.add('open');
 c.querySelector('.cp').onclick=e=>{navigator.clipboard.writeText(x.script);e.target.textContent='Copied!';setTimeout(()=>e.target.textContent='Copy',1200)};
 c.querySelector('.cs').onchange=e=>{open[x.stock]=1;send({s:x.stock,k:'s',v:e.target.checked?1:0})};
 c.querySelector('.cb').onchange=e=>{open[x.stock]=1;send({s:x.stock,k:'b',v:e.target.checked?1:0})};
 const pb=c.querySelector('.post');if(pb)pb.onclick=()=>{if(confirm('Mark this video as posted? Checks reset and the car moves down the list.')){delete open[x.stock];send({s:x.stock,k:'p',v:1,date:today})}};
 L.appendChild(c)})}
setInterval(pull,10000);addEventListener('focus',pull);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
document.getElementById('q').oninput=render;document.getElementById('f').onchange=render;load();
</script></body></html>
